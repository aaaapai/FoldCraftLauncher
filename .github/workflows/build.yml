name: LWJGL

on:
  pull_request:
  workflow_dispatch:

jobs:
  LWJGL_Build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        
      - name: set up JDK 21
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main
        with:
           allow-snapshot-wrappers: true
      
      - name: Build LWJGL
        run: |
          chmod +x gradlew
          ./gradlew LWJGL-Pojav:build

      - name: Upload lwjgl
        uses: actions/upload-artifact@main
        with:
          name: lwjgl-glfw-classes
          path: |
                out/lwjgl.jar
